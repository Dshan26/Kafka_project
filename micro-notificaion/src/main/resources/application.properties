
spring.application.name=micro-notification
server.port=8003

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.sandoval.model.cms.model.InventoryEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

spring.kafka.topic.inventory=inventory_topic


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-address
spring.mail.password=generate-password-google
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
notification.mail.from=sandovalcamilo496@gmail.com
